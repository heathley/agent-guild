name = "agent-guild-edge"
main = "worker/index.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "PAIRING_SESSIONS"
class_name = "PairingSession"

[[durable_objects.bindings]]
name = "WRITE_GUARD"
class_name = "WriteGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WriteGuard"]

[vars]
PUBLIC_WRITES = "true"
APP_ORIGIN = "https://agent-guild-heathley.pages.dev"
EXPECTED_CONFIG_SHA256 = "a320253a371a8118bfc3882ad433a790292aa353af75fcf98d943af6711bf0fd"
EXPECTED_OPENAPI_SHA256 = "5ba02a3e5d777e21476d2e2100798e70b4a6bbb0bcde76efcbc57f799b7bac6f"
EXPECTED_LLMS_SHA256 = "36e6db26eb38abf7e2b5d7938c77ac9889ab1e5ce87eca0e3738fea75c18883e"
# Public writes were enabled only after the staging relay completed a
# human-approved DID + nonce + exact-text read-back test. Hashes are still
# compared live before every write and any mismatch closes the relay.
