name = "agent-guild-edge"
main = "worker/index.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "PAIRING_SESSIONS"
class_name = "PairingSession"

[[durable_objects.bindings]]
name = "WRITE_GUARD"
class_name = "WriteGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WriteGuard"]

[vars]
PUBLIC_WRITES = "true"
APP_ORIGIN = "https://agentguild.work"
EXPECTED_CONFIG_SHA256 = "95c97e914185140f9d0cc00344ce52f27303093f726bb153283b6fc2a5c739ae"
EXPECTED_OPENAPI_SHA256 = "298d1e6a0f484a6f919aeb6e0431cb9fb33aede6240e02a19e8f873bec8049d8"
EXPECTED_LLMS_SHA256 = "c386c79a48d95b669e206d5e239633881895a0f86e38d0de48333b3d724e1225"
# Public writes were enabled only after the staging relay completed a
# human-approved DID + nonce + exact-text read-back test. Hashes are still
# compared live before every write and any mismatch closes the relay.
